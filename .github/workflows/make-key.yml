# Save as: .github/workflows/make-key.yml
# Run ONCE from the Actions tab. Before running, add the secret KEYSTORE_PASSWORD
# (any password you choose, at least 6 characters, no spaces).
name: Make signing key (run once)

on:
  workflow_dispatch:

jobs:
  key:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - name: Check password secret
        run: '[ -n "$KS_PASS" ] || { echo "::error::Add the KEYSTORE_PASSWORD secret first"; exit 1; }'

      - name: Create keystore
        run: |
          keytool -genkeypair -v -keystore bee.jks -alias bee \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=BEE Messenger, O=BEE, C=US"
          base64 -w0 bee.jks > keystore_base64.txt
          mkdir out && mv keystore_base64.txt out/

      - name: Show SHA-1 (needed in Google Cloud)
        run: |
          keytool -list -v -keystore bee.jks -storepass "$KS_PASS" | grep -E "SHA1|SHA-1"
          echo "::notice title=SHA-1::$(keytool -list -v -keystore bee.jks -storepass "$KS_PASS" | grep 'SHA1' | head -1)"

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: out/keystore_base64.txt
          retention-days: 1
