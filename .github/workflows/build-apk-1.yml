# Save as: .github/workflows/build-apk.yml
# Repo root must contain: bee-messenger.zip (and optionally icon.png)
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['bee-messenger.zip', 'icon.png', '.github/workflows/build-apk.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      CID: ${{ secrets.ANDROID_CLIENT_ID }}
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: bee
      TURN_JSON: ${{ secrets.TURN_JSON }}   # optional: your TURN relay as JSON, see README
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check secrets
        run: |
          for v in CID KS_PASS KEY_PASS KEY_ALIAS; do
            [ -n "${!v}" ] || { echo "::error::Missing secret for $v"; exit 1; }
          done
          [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] || { echo "::error::Missing KEYSTORE_BASE64"; exit 1; }

      - name: Unpack the web app into www/
        run: |
          mkdir -p mobile/www
          unzip -o bee-messenger.zip -d mobile/www
          [ -f icon.png ] && cp icon.png mobile/www/icon.png || echo "No icon.png, using fallback logo"
          # The zip in the repo must be the latest version (it must contain the Android sign-in code)
          grep -q "Capacitor" mobile/www/app.js || { echo "::error::bee-messenger.zip in your repo is an OLD version. Upload the newest bee-messenger.zip to the repo root."; exit 1; }
          # Android-only sources travel inside the zip but must not be shipped as web files
          [ -d mobile/www/android-native ] || { echo "::error::android-native/ folder missing from bee-messenger.zip (old zip?)"; exit 1; }
          mv mobile/www/android-native mobile/android-native
          # Pass the Android Client ID (+ optional TURN relay) to the app (CSP only allows scripts from 'self', so it is a file)
          python3 - <<'PY2'
          import os, json
          turn = os.environ.get('TURN_JSON', '').strip()
          try: t = json.loads(turn) if turn else []
          except Exception: t = []
          open('mobile/www/bee-native.js', 'w').write('window.BEE_NATIVE = ' + json.dumps({'clientId': os.environ['CID'], 'turn': t}) + ';')
          PY2
          sed -i 's#<script type="module" src="app.js"></script>#<script src="bee-native.js"></script>&#' mobile/www/index.html
          grep -q "bee-native.js" mobile/www/index.html || { echo "::error::Could not inject bee-native.js into index.html"; exit 1; }

      - name: Create Capacitor project
        working-directory: mobile
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 \
                @capacitor/app@6 @capacitor/browser@6 @capacitor/filesystem@6 \
                @capacitor/share@6 @capacitor/local-notifications@6 \
                @capacitor-mlkit/barcode-scanning@6
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.bee.messenger",
            "appName": "BEE Messenger",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          JSON
          npx cap add android
          # QR scanner needs Android 7+, QR drawing uses ZXing
          sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation "com.google.zxing:core:3.5.3"/' android/app/build.gradle
          grep -n "zxing" android/app/build.gradle

      - name: App icon (launcher) from icon.png
        if: hashFiles('icon.png') != ''
        working-directory: mobile
        run: |
          pip install pillow
          python3 - <<'PY3'
          import os
          from PIL import Image, ImageDraw
          src = Image.open('../icon.png').convert('RGBA')
          w, h = src.size
          side = min(w, h)
          src = src.crop(((w - side) // 2, (h - side) // 2, (w - side) // 2 + side, (h - side) // 2 + side))
          px = src.getpixel((2, 2))
          bg = '#%02x%02x%02x' % px[:3] if px[3] == 255 else '#0a1634'
          res = 'android/app/src/main/res'
          legacy = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for d, n in legacy.items():
              os.makedirs(f'{res}/mipmap-{d}', exist_ok=True)
              im = src.resize((n, n), Image.LANCZOS)
              im.save(f'{res}/mipmap-{d}/ic_launcher.png')
              m = Image.new('L', (n, n), 0)
              ImageDraw.Draw(m).ellipse((0, 0, n - 1, n - 1), fill=255)
              r = im.copy(); r.putalpha(m)
              r.save(f'{res}/mipmap-{d}/ic_launcher_round.png')
              # adaptive foreground: 108dp canvas, artwork inside the 66% safe zone
              c = round(n * 108 / 48)
              inner = round(c * 0.62)
              fg = Image.new('RGBA', (c, c), (0, 0, 0, 0))
              fg.paste(src.resize((inner, inner), Image.LANCZOS), ((c - inner) // 2, (c - inner) // 2))
              fg.save(f'{res}/mipmap-{d}/bee_fg.png')
          os.makedirs(f'{res}/values', exist_ok=True)
          open(f'{res}/values/bee_icon.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?><resources><color name="bee_icon_bg">%s</color></resources>' % bg)
          os.makedirs(f'{res}/mipmap-anydpi-v26', exist_ok=True)
          xml = '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/bee_icon_bg"/><foreground android:drawable="@mipmap/bee_fg"/></adaptive-icon>'
          for n in ('ic_launcher', 'ic_launcher_round'):
              open(f'{res}/mipmap-anydpi-v26/{n}.xml', 'w').write(xml)
          print('Launcher icon written, background', bg)
          PY3

      - name: Patch AndroidManifest (login redirect + permissions)
        working-directory: mobile
        run: |
          python3 - <<'PY'
          import os
          cid = os.environ['CID']
          scheme = 'com.googleusercontent.apps.' + cid.replace('.apps.googleusercontent.com', '')
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          flt = ('<intent-filter><action android:name="android.intent.action.VIEW"/>'
                 '<category android:name="android.intent.category.DEFAULT"/>'
                 '<category android:name="android.intent.category.BROWSABLE"/>'
                 '<data android:scheme="%s"/></intent-filter>' % scheme)
          s = s.replace('</activity>', flt + '</activity>', 1)
          perms = ('<uses-permission android:name="android.permission.RECORD_AUDIO"/>'
                   '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>'
                   '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>')
          perms += ('<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>'
                    '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>'
                    '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>'
                    '<uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>'
                    '<uses-permission android:name="android.permission.WAKE_LOCK"/>'
                    '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>')
          comps = ('<service android:name=".BeeService" android:exported="false" android:foregroundServiceType="specialUse">'
                   '<property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" '
                   'android:value="Checks the user own mailbox for end-to-end encrypted chat messages"/></service>'
                   '<receiver android:name=".AlarmReceiver" android:exported="false"/>'
                   '<receiver android:name=".BootReceiver" android:exported="true"><intent-filter>'
                   '<action android:name="android.intent.action.BOOT_COMPLETED"/>'
                   '<action android:name="android.intent.action.MY_PACKAGE_REPLACED"/></intent-filter></receiver>')
          assert '</application>' in s
          s = s.replace('</application>', comps + '</application>', 1)
          s = s.replace('</manifest>', perms + '</manifest>')
          open(p, 'w').write(s)
          PY

      - name: Add the background listener (Java)
        working-directory: mobile
        run: |
          D=android/app/src/main/java/com/bee/messenger
          mkdir -p "$D"
          cp android-native/*.java "$D"/
          ls "$D"

      - name: Sync and build release APK
        working-directory: mobile
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        working-directory: mobile
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bee.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks bee.jks \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --ks-key-alias "$KEY_ALIAS" --out BEE-Messenger.apk aligned.apk
          "$BT/apksigner" verify BEE-Messenger.apk
          rm -f bee.jks

      - uses: actions/upload-artifact@v4
        with:
          name: BEE-Messenger-apk
          path: mobile/BEE-Messenger.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: BEE Messenger APK #${{ github.run_number }}
          files: mobile/BEE-Messenger.apk
